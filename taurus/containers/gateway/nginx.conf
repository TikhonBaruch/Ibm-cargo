worker_processes auto;
events { worker_connections 1024; }

http {
  upstream web      { server web:3000; }
  upstream admin    { server admin:3001; }
  upstream broker   { server broker:3002; }
  upstream client   { server client:3003; }
  upstream manufacturer { server manufacturer:3004; }
  upstream api      { server api:4000; }
  upstream ai       { server ai:4100; }
  upstream worker   { server worker:4200; }
  upstream payments { server payments:4300; }
  upstream notify   { server notify:4400; }
  upstream llm      { server llm:4500; }
  upstream logistics { server logistics:4600; }
  upstream ocr      { server ocr:4700; }

  server {
    listen 80;
    server_name _;

    location = /health {
      default_type application/json;
      return 200 '{"ok":true,"service":"gateway"}';
    }

    location /api/v1/ai/ {
      rewrite ^/api/v1/ai/(.*)$ /$1 break;
      proxy_pass http://ai;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    location /api/domain/ {
      rewrite ^/api/domain/(.*)$ /$1 break;
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    location /api/worker/ {
      rewrite ^/api/worker/(.*)$ /$1 break;
      proxy_pass http://worker;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    location /api/payments/ {
      rewrite ^/api/payments/(.*)$ /$1 break;
      proxy_pass http://payments;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    location /api/notify/ {
      rewrite ^/api/notify/(.*)$ /$1 break;
      proxy_pass http://notify;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    location /api/llm/ {
      rewrite ^/api/llm/(.*)$ /$1 break;
      proxy_pass http://llm;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    location /api/logistics/ {
      rewrite ^/api/logistics/(.*)$ /$1 break;
      proxy_pass http://logistics;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    location /api/ocr/ {
      rewrite ^/api/ocr/(.*)$ /$1 break;
      proxy_pass http://ocr;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    location /admin-app/ {
      proxy_pass http://admin/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    location /broker-app/ {
      proxy_pass http://broker/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    location /client-app/ {
      proxy_pass http://client/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    location /manufacturer-app/ {
      proxy_pass http://manufacturer/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    location / {
      proxy_pass http://web;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
