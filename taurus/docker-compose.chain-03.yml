# Chain 3 — DeepSeek-only overlay for Compose
#
# Usage (from taurus root, with base compose):
#   docker compose -f docker-compose.yml -f docker-compose.chain-03.yml --profile scale up -d llm ocr api
#
# Requires DEEPSEEK_API_KEY in .env (or shell). Does not add vendor containers.

services:
  llm:
    environment:
      AI_CHAIN_ID: "3"
      LLM_PROVIDER: deepseek
      LLM_CLASSIFY_CHAIN: deepseek
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}

  ocr:
    environment:
      AI_CHAIN_ID: "3"
      # OCR /v1/describe uses DeepSeek vision when chainId/AI_CHAIN_ID=3; Qwen optional for extract fallback.
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_VISION_MODEL: ${DEEPSEEK_VISION_MODEL:-deepseek-v4-flash-vision-exp}

  api:
    environment:
      AI_CHAIN_ID: "3"
      LLM_CLASSIFY_CHAIN: deepseek
      LLM_PROVIDER: deepseek

  web:
    environment:
      AI_CHAIN_ID: "3"
      LLM_CLASSIFY_CHAIN: deepseek
      LLM_PROVIDER: deepseek

  worker:
    environment:
      AI_CHAIN_ID: "3"
      LLM_CLASSIFY_CHAIN: deepseek
      LLM_PROVIDER: deepseek
