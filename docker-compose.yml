# LBM Брокер — Docker Compose
# Каждый сервис живёт в containers/<name>/
#
# Профили:
#   core   — postgres + redis + api + ai + worker
#   web    — + Next (лендинг, /cabinet; пока также /admin и /broker)
#   split  — admin Next (D20) + broker Next (D16) + client Next (D17)
# Ответвления: docs/knowledge/containerization.md (C1→C5, D19)
#   scale  — payments + notify (+ core backends)
#   full   — всё + gateway

name: lbm

networks:
  lbm:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  ved_uploads:

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    <<: *restart
    image: pgvector/pgvector:pg17
    profiles: ["core", "full", "web", "scale"]
    networks: [lbm]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lbm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lbm}
      POSTGRES_DB: ${POSTGRES_DB:-lbm}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./containers/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lbm} -d ${POSTGRES_DB:-lbm}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    <<: *restart
    image: redis:7-alpine
    profiles: ["core", "full", "web", "scale"]
    networks: [lbm]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    <<: *restart
    build:
      context: .
      dockerfile: containers/api/Dockerfile
    profiles: ["core", "full", "web", "scale"]
    networks: [lbm]
    ports:
      - "${API_PORT:-4000}:4000"
    environment:
      PORT: 4000
      NODE_ENV: ${NODE_ENV:-development}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      # Compose Mode B: always use in-network postgres (do not inherit host DATABASE_URL).
      # Defaults match long-lived local volume (POSTGRES_*); override via .env / docker.env.
      DATABASE_URL: postgresql://${POSTGRES_USER:-lbm}:${POSTGRES_PASSWORD:-lbm}@postgres:5432/${POSTGRES_DB:-lbm}?schema=public
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-secret-change-me}
      WEB_SERVICE_URL: ${WEB_SERVICE_URL:-http://web:3000}
      AI_SERVICE_URL: http://ai:4100
      NOTIFY_SERVICE_URL: ${NOTIFY_SERVICE_URL:-http://notify:4400}
      PRECEDENTS_SERVICE_URL: ${PRECEDENTS_SERVICE_URL:-http://precedents:4800}
      LOGISTICS_SERVICE_URL: ${LOGISTICS_SERVICE_URL:-http://logistics:4600}
      PAYMENTS_SERVICE_URL: ${PAYMENTS_SERVICE_URL:-http://payments:4300}
      OCR_SERVICE_URL: ${OCR_SERVICE_URL:-http://ocr:4700}
      # Inside Compose always use service DNS (not host .env 127.0.0.1:4500).
      LLM_SERVICE_URL: http://llm:4500
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-30000}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-35000}
    depends_on:
      redis:
        condition: service_healthy
      ai:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  ai:
    <<: *restart
    build:
      context: .
      dockerfile: containers/ai/Dockerfile
    profiles: ["core", "full", "web", "scale"]
    networks: [lbm]
    ports:
      - "${AI_PORT:-4100}:4100"
    environment:
      PORT: 4100
      NODE_ENV: ${NODE_ENV:-development}
      LLM_SERVICE_URL: http://llm:4500
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-30000}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4100/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    <<: *restart
    build: ./containers/worker
    profiles: ["core", "full", "web", "scale"]
    networks: [lbm]
    ports:
      - "${WORKER_PORT:-4200}:4200"
    environment:
      PORT: 4200
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      API_SERVICE_URL: http://api:4000
      AI_SERVICE_URL: http://ai:4100
      WEB_SERVICE_URL: ${WEB_SERVICE_URL:-http://web:3000}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-secret-change-me}
      SLA_TICK_INTERVAL_MS: ${SLA_TICK_INTERVAL_MS:-10000}
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4200/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  payments:
    <<: *restart
    build: ./containers/payments
    profiles: ["scale", "full"]
    networks: [lbm]
    ports:
      - "${PAYMENTS_PORT:-4300}:4300"
    environment:
      PORT: 4300
      WEBHOOK_TARGET: ${PAYMENTS_WEBHOOK_TARGET:-http://api:4000/v1/webhooks/payments}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-secret-change-me}
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
      YOOKASSA_RETURN_URL: ${YOOKASSA_RETURN_URL:-}
      PAYMENTS_PUBLIC_URL: ${PAYMENTS_PUBLIC_URL:-http://localhost:4300}
      ALLOW_FORCE_CONFIRM: ${ALLOW_FORCE_CONFIRM:-0}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4300/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  notify:
    <<: *restart
    build: ./containers/notify
    profiles: ["scale", "full"]
    networks: [lbm]
    ports:
      - "${NOTIFY_PORT:-4400}:4400"
    environment:
      PORT: 4400
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-secret-change-me}
      SMTP_URL: ${SMTP_URL:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@lbm.local}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4400/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  precedents:
    <<: *restart
    build:
      context: .
      dockerfile: containers/precedents/Dockerfile
    profiles: ["scale", "full"]
    networks: [lbm]
    ports:
      - "${PRECEDENTS_PORT:-4800}:4800"
    environment:
      PORT: 4800
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-lbm}:${POSTGRES_PASSWORD:-lbm}@postgres:5432/${POSTGRES_DB:-lbm}?schema=public
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-secret-change-me}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4800/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  llm:
    <<: *restart
    # Canon: llm/services/classification. Default mirror: ./containers/llm.
    # Override: LLM_DOCKER_CONTEXT=./llm/services/classification
    build:
      context: ${LLM_DOCKER_CONTEXT:-./containers/llm}
    profiles: ["scale", "full"]
    networks: [lbm]
    ports:
      - "${LLM_PORT:-4500}:4500"
    environment:
      PORT: 4500
      NODE_ENV: ${NODE_ENV:-development}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      LLM_CLASSIFY_MODEL: ${LLM_CLASSIFY_MODEL:-}
      LLM_DUTY_MODEL: ${LLM_DUTY_MODEL:-}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-30000}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-}
      QWEN_MODEL: ${QWEN_MODEL:-}
      TNVED_CODES_PATH: ${TNVED_CODES_PATH:-/data/tnved/codes.jsonl}
    volumes:
      - ${TNVED_DATA_DIR:-./llm/data/tnved/normalized}:/data/tnved:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4500/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  logistics:
    <<: *restart
    build: ./containers/logistics
    profiles: ["scale", "full"]
    networks: [lbm]
    ports:
      - "${LOGISTICS_PORT:-4600}:4600"
    environment:
      PORT: 4600
      NODE_ENV: ${NODE_ENV:-development}
      LOGISTICS_PROVIDER: ${LOGISTICS_PROVIDER:-demo}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4600/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  ocr:
    <<: *restart
    # Canon: llm/services/ocr. Default mirror: ./containers/ocr.
    # Override: OCR_DOCKER_CONTEXT=./llm/services/ocr
    build:
      context: ${OCR_DOCKER_CONTEXT:-./containers/ocr}
    profiles: ["scale", "full"]
    networks: [lbm]
    ports:
      - "${OCR_PORT:-4700}:4700"
    environment:
      PORT: 4700
      NODE_ENV: ${NODE_ENV:-development}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OCR_VISION_MODEL: ${OCR_VISION_MODEL:-}
      OCR_TIMEOUT_MS: ${OCR_TIMEOUT_MS:-20000}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-}
      QWEN_VISION_MODEL: ${QWEN_VISION_MODEL:-qwen-vl-plus}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4700/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    <<: *restart
    build:
      context: .
      dockerfile: containers/web/Dockerfile
    profiles: ["web", "full"]
    networks: [lbm]
    ports:
      - "${WEB_PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 3000
      NODE_ENV: production
      # Compose Mode B: always use in-network postgres (do not inherit host DATABASE_URL).
      DATABASE_URL: postgresql://${POSTGRES_USER:-lbm}:${POSTGRES_PASSWORD:-lbm}@postgres:5432/${POSTGRES_DB:-lbm}?schema=public
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev-secret-change-me}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_AI_URL: ${NEXT_PUBLIC_AI_URL:-http://localhost:4100}
      AI_SERVICE_URL: http://ai:4100
      API_SERVICE_URL: http://api:4000
      DOMAIN_API_URL: http://api:4000
      USE_DOMAIN_API: "1"
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-secret-change-me}
      WORKER_SERVICE_URL: http://worker:4200
      PAYMENTS_SERVICE_URL: http://payments:4300
      NOTIFY_SERVICE_URL: http://notify:4400
      PRECEDENTS_SERVICE_URL: ${PRECEDENTS_SERVICE_URL:-http://precedents:4800}
      LLM_SERVICE_URL: http://llm:4500
      LOGISTICS_SERVICE_URL: ${LOGISTICS_SERVICE_URL:-http://logistics:4600}
      OCR_SERVICE_URL: ${OCR_SERVICE_URL:-http://ocr:4700}
      REDIS_URL: redis://redis:6379
      APP_SURFACE: ${WEB_SURFACE:-full}
      # C5: WEB_SURFACE=slim → landing+auth+proxy only; cabinets via split (docs)
    volumes:
      # Local VED uploads when S3_* unset (dev/smoke). Prod/Vercel → S3.
      - ved_uploads:/app/public/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
      ai:
        condition: service_healthy

  admin:
    <<: *restart
    build:
      context: .
      dockerfile: containers/admin/Dockerfile
    profiles: ["split", "full"]
    networks: [lbm]
    ports:
      - "${ADMIN_PORT:-3001}:3001"
    environment:
      PORT: 3001
      APP_SURFACE: admin
      NODE_ENV: production
      NEXTAUTH_URL: ${ADMIN_NEXTAUTH_URL:-http://localhost:3001}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev-secret-change-me}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      WEB_API_ORIGIN: ${WEB_API_ORIGIN:-http://web:3000}
      API_SERVICE_URL: http://api:4000
      NEXT_PUBLIC_ADMIN_BASE: ""
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 40s

  broker:
    <<: *restart
    build:
      context: .
      dockerfile: containers/broker/Dockerfile
    profiles: ["split", "full"]
    networks: [lbm]
    ports:
      - "${BROKER_PORT:-3002}:3002"
    environment:
      PORT: 3002
      APP_SURFACE: broker
      NODE_ENV: production
      NEXTAUTH_URL: ${BROKER_NEXTAUTH_URL:-http://localhost:3002}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev-secret-change-me}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      WEB_API_ORIGIN: ${WEB_API_ORIGIN:-http://web:3000}
      API_SERVICE_URL: http://api:4000
      AI_SERVICE_URL: http://ai:4100
      NEXT_PUBLIC_SITE_URL: ${BROKER_PUBLIC_URL:-http://localhost:3002}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3002/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  client:
    <<: *restart
    build:
      context: .
      dockerfile: containers/client/Dockerfile
    profiles: ["split", "full"]
    networks: [lbm]
    ports:
      - "${CLIENT_PORT:-3003}:3003"
    environment:
      PORT: 3003
      APP_SURFACE: client
      NODE_ENV: production
      NEXTAUTH_URL: ${CLIENT_NEXTAUTH_URL:-http://localhost:3003}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev-secret-change-me}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      WEB_API_ORIGIN: ${WEB_API_ORIGIN:-http://web:3000}
      API_SERVICE_URL: http://api:4000
      NEXT_PUBLIC_SITE_URL: ${CLIENT_PUBLIC_URL:-http://localhost:3003}
      NEXT_PUBLIC_CLIENT_BASE:
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3003/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  manufacturer:
    <<: *restart
    build:
      context: .
      dockerfile: containers/manufacturer/Dockerfile
    profiles: ["split", "full"]
    networks: [lbm]
    ports:
      - "${MANUFACTURER_PORT:-3004}:3004"
    environment:
      PORT: 3004
      APP_SURFACE: manufacturer
      NODE_ENV: production
      NEXTAUTH_URL: ${MANUFACTURER_NEXTAUTH_URL:-http://localhost:3004}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev-secret-change-me}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      WEB_API_ORIGIN: ${WEB_API_ORIGIN:-http://web:3000}
      API_SERVICE_URL: http://api:4000
      NEXT_PUBLIC_SITE_URL: ${MANUFACTURER_PUBLIC_URL:-http://localhost:3004}
      NEXT_PUBLIC_MANUFACTURER_BASE:
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3004/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  gateway:
    <<: *restart
    build: ./containers/gateway
    profiles: ["full"]
    networks: [lbm]
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      - web
      - admin
      - broker
      - client
      - manufacturer
      - api
      - ai
      - worker
      - payments
      - notify
      - precedents
      - llm
      - logistics
      - ocr
