worker_processes 1;
events { worker_connections 128; }
http {
  upstream classification { server classification:4500; }
  upstream ocr { server ocr:4700; }
  upstream logistics { server logistics:4601; }
  upstream documents { server documents:4750; }
  upstream broker { server broker:4800; }
  upstream risk { server risk:4900; }

  server {
    listen 80;

    location /health {
      default_type application/json;
      return 200 '{"ok":true,"service":"llm-matrix-gateway"}';
    }

    location /api/classification/ {
      rewrite ^/api/classification/(.*)$ /$1 break;
      proxy_pass http://classification;
    }
    location /api/llm/ {
      rewrite ^/api/llm/(.*)$ /$1 break;
      proxy_pass http://classification;
    }
    location /api/ocr/ {
      rewrite ^/api/ocr/(.*)$ /$1 break;
      proxy_pass http://ocr;
    }
    location /api/logistics/ {
      rewrite ^/api/logistics/(.*)$ /$1 break;
      proxy_pass http://logistics;
    }
    location /api/documents/ {
      rewrite ^/api/documents/(.*)$ /$1 break;
      proxy_pass http://documents;
    }
    location /api/broker/ {
      rewrite ^/api/broker/(.*)$ /$1 break;
      proxy_pass http://broker;
    }
    location /api/risk/ {
      rewrite ^/api/risk/(.*)$ /$1 break;
      proxy_pass http://risk;
    }
  }
}
