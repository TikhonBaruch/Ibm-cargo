services:
  classification:
    build: ./services/classification
    ports:
      - "${CLASSIFICATION_PORT:-4500}:4500"
    environment:
      PORT: "4500"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-https://api.openai.com/v1}"
      LLM_CLASSIFY_MODEL: "${LLM_CLASSIFY_MODEL:-gpt-4o-mini}"
      LLM_DUTY_MODEL: "${LLM_DUTY_MODEL:-gpt-4o-mini}"
      LLM_TIMEOUT_MS: "${LLM_TIMEOUT_MS:-12000}"
      LLM_PROVIDER: "${LLM_PROVIDER:-}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      DEEPSEEK_BASE_URL: "${DEEPSEEK_BASE_URL:-}"
      DEEPSEEK_MODEL: "${DEEPSEEK_MODEL:-}"
      QWEN_API_KEY: "${QWEN_API_KEY:-}"
      QWEN_BASE_URL: "${QWEN_BASE_URL:-}"
      QWEN_MODEL: "${QWEN_MODEL:-}"

  ocr:
    build: ./services/ocr
    ports:
      - "${OCR_PORT:-4700}:4700"
    environment:
      PORT: "4700"

  logistics:
    build: ./services/logistics
    ports:
      - "${LOGISTICS_PORT:-4601}:4601"
    environment:
      PORT: "4601"

  documents:
    build: ./services/documents
    ports:
      - "${DOCUMENTS_PORT:-4750}:4750"
    environment:
      PORT: "4750"

  broker:
    build: ./services/broker
    ports:
      - "${BROKER_PORT:-4800}:4800"
    environment:
      PORT: "4800"

  risk:
    build: ./services/risk
    ports:
      - "${RISK_PORT:-4900}:4900"
    environment:
      PORT: "4900"

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "${GATEWAY_PORT:-8088}:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - classification
      - ocr
      - logistics
      - documents
      - broker
      - risk
